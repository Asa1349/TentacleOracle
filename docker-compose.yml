services:
  tentacleoracle:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tentacleoracle

    restart: unless-stopped

    ports:
      - "7070:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

    volumes:
      - ./TentacleOracle/database:/app/database